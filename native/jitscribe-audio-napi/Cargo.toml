[package]
name = "jitscribe-audio-napi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
jitscribe-audio-core = { path = "../jitscribe-audio-core" }
jitscribe-whisper-core = { path = "../jitscribe-whisper-core" }
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
