name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update
      - run: sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libpulse-dev
      - run: npm run test:native
      - run: npm run build:native
      - run: node -e "const addon = require('./native/jitscribe-audio-napi/index.cjs'); if (typeof addon.listAudioDevices !== 'function') process.exit(1)"
      - run: npm pack --dry-run
